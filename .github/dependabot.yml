version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    # Node types follow the supported runtime major in package.json.
    # Vue language tools still require the JavaScript TypeScript compiler API:
    # https://github.com/vuejs/language-tools/issues/6124
    # Recheck these major boundaries when runtime/toolchain support changes.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        versions: ['>=7']
